# ProviderMap configuration.
#
# Copy this file to config.yaml and edit politeness.user_agent before running
# anything against a live site (or set PROVIDERMAP_CONTACT_EMAIL instead -
# see .env.example). config.yaml is gitignored so local edits never get
# committed; config.example.yaml is the template everyone shares.
#
# Every tunable ProviderMap uses lives here - nothing is hardcoded in the
# Python source. If you find yourself editing a .py file to change a delay,
# a timeout, or a path, that's a bug; please file it.
#
# These `site` values are AdventHealth's - the only adapter currently
# registered. A second adapter would ship its own example config, or this
# file would grow a `sites:` map keyed by adapter name; see CONTRIBUTING.md.

site:
  base_url: "https://www.adventhealth.com"
  listing_path: "/doctors"

  # ProviderMap probes for a real API before it will scrape HTML, in this
  # order (cheapest first): sitemap -> jsonapi -> views_ajax -> html_listing.
  # Leave force_source null to auto-probe on every run. Set it to one of the
  # four names once you know which one works, to skip re-probing.
  force_source: null

  # Only used by the html_listing fallback source.
  page_param: "page"
  page_start: 0

  # Structured per-NPI contact-card endpoint, if the site has one (AdventHealth
  # does). Adapters that supply their own vcard_url() override or ignore this.
  vcard_path: "/physician/vcard/{npi}"

  # "http" (plain httpx client, default) or "playwright" (real browser
  # rendering - see the `rendering:` section below). AdventHealth's Akamai
  # bot-management blocks plain HTTP clients (including on robots.txt
  # itself) but not a normal browser, so this adapter needs "playwright" for
  # anything past the sitemap/robots.txt probes. Requires
  # `pip install -e ".[render]"` and a one-time `playwright install chromium`.
  fetch_mode: "http"

politeness:
  # Requests per second against the target site. 0.5 = one request every 2s.
  requests_per_second: 0.5
  max_concurrent: 2
  timeout_seconds: 30
  user_agent: "ProviderMapBot/1.0 (+contact: REPLACE_WITH_YOUR_EMAIL)"

  # Hard stop if the site starts erroring - do not hammer a site that is
  # telling you to go away.
  abort_after_consecutive_errors: 25

  respect_robots_txt: true  # Do not set to false.

retries:
  max_attempts: 4
  backoff_base_seconds: 2  # 2, 4, 8, 16
  backoff_max_seconds: 60
  retry_on_status: [429, 500, 502, 503, 504]

# ---------------------------------------------------------------------------
# NPI / NPPES policy
#
# NPPES (the free public CMS registry) is what makes the facility-vs-person
# call authoritative rather than a name-pattern guess. It is optional: with
# `enabled: false` the pipeline still produces a dataset, using credential and
# name heuristics instead - every affected record is marked
# nppes_enumeration='not_found' and given lower site_confidence, so the
# degradation is visible rather than silent.
# ---------------------------------------------------------------------------
nppes:
  enabled: true
  api_url: "https://npiregistry.cms.hhs.gov/api/"
  version: "2.1"
  requests_per_second: 2.0  # separate budget; CMS is a government API
  timeout_seconds: 20
  # If NPPES starts failing, stop asking and fall back to heuristics rather
  # than spending hours timing out against a dead endpoint.
  trip_after_consecutive_failures: 20

npi:
  # strict -> a bad CMS checksum excludes the record
  # warn   -> kept, flagged in source_notes   (default)
  # off    -> not checked
  checksum: "warn"
  require_npi: true      # exclude records with no NPI at all
  require_nppes: false   # true -> exclude anything NPPES cannot confirm

database:
  path: "database/providermap.db"

cache:
  enabled: true
  dir: ".cache"
  ttl_days: 30

logging:
  dir: "logs"
  level: "INFO"

investigation:
  sample_size: 750

incremental:
  # `providermap refresh` re-checks records older than this many days.
  refresh_older_than_days: 30
  # After a COMPLETE discovery pass, mark providers who no longer appear in
  # the directory as inactive. Never deleted - historical billing rows still
  # point at them. Skipped automatically on partial/--limit runs.
  deactivate_missing: true

exports:
  dir: "exports/output"

# ---------------------------------------------------------------------------
# Organizations (hospitals, health systems, clinics) - see ROADMAP.md.
# ---------------------------------------------------------------------------
organizations:
  # null (default): `cms_hospitals` auto-fetches CMS's current "Hospital
  # General Information" dataset itself on every `ingest-organizations` run,
  # via CMS's metastore API - no manual download. Set to a path to pin a
  # local copy instead.
  cms_hospitals_csv_path: null
  cms_hospitals_fetch_timeout_seconds: 30.0

  # `providermap enrich-organizations` tries Wikidata's verified hospital
  # website data first (one bulk query - see
  # providermap/wikidata_hospitals.py), then HIFLD's Hospitals dataset (see
  # providermap/hifld_hospitals.py - every match is reachability-checked and
  # stored only as MEDIUM confidence, since HIFLD's own data is measurably
  # stale), then falls back to a best-effort name-guess for whatever's still
  # missing (see providermap/website_enrichment.py for why that fallback is
  # a guess, never authoritative). Requests spread across many unrelated
  # domains, so this is its own conservative budget, separate from
  # `politeness.*`.
  wikidata_fetch_timeout_seconds: 60.0
  hifld_fetch_timeout_seconds: 60.0
  website_enrichment_requests_per_second: 1.0
  website_enrichment_timeout_seconds: 8.0

  # A hospital checked and still left with no website isn't retried again
  # for this many days - otherwise every enrich-organizations run re-guesses
  # domains for every hospital that has ever come up empty. 0 = always retry.
  website_recheck_after_days: 30

  # `providermap enrich-organizations` also tries the VA Facilities API
  # (see providermap/va_facilities.py) between HIFLD and guessing - narrowly
  # scoped to VA-type organizations. null (default) skips this source
  # entirely. To enable it: register a free sandbox key at
  # https://developer.va.gov/explore/api/va-facilities/sandbox-access and
  # set it here - never commit a real key (config.yaml is gitignored).
  va_api_key: null
  va_facilities_base_url: "https://sandbox-api.va.gov/services/va_facilities/v1"
  va_facilities_fetch_timeout_seconds: 30.0

  # `providermap enrich-organizations` also consults a local OpenStreetMap
  # hospital index (see providermap/osm_hospitals.py) between VA and
  # guessing. This never calls a live API during enrichment - Phase 6.0
  # measured the public Overpass API failing under load, so instead run
  # `providermap refresh-osm-cache` periodically (a heavy, one-time bulk
  # download of a ~12GB Geofabrik US extract) to build a small local JSON
  # cache at osm_cache_path. null (default) or a missing cache file skips
  # this source entirely.
  osm_cache_path: null
  osm_pbf_url: "https://download.geofabrik.de/north-america/us-latest.osm.pbf"

# Provider *dataset/API* adapters (see adapters/providers/base_dataset.py) -
# as opposed to `site` above, which configures the scraped-directory
# pipeline. `providermap ingest-providers` uses this section.
providers:
  # Cigna's public FHIR R4 Provider Directory (Da Vinci PDex Plan-Net) - no
  # auth required. See adapters/providers/cigna_fhir/adapter.py.
  cigna_fhir_base_url: "https://fhir.cigna.com/ProviderDirectory/v1"

  # Two-letter state code (e.g. "CT") to scope a pilot run to one state via
  # the Plan-Net `location.address-state` search parameter. null (default)
  # means unscoped - do not run unscoped against production; Cigna's
  # directory is national and a pilot should stay to one state.
  cigna_fhir_state: null

  cigna_fhir_page_size: 50
  cigna_fhir_fetch_timeout_seconds: 30.0

  # NPPES enrichment for Cigna-sourced providers is off by default - the
  # FHIR response already carries NPI/name/taxonomy, and NPPES is the
  # pipeline's main runtime cost driver (see nppes: above). Opt in to
  # compare against the FHIR-only pilot numbers.
  cigna_fhir_use_nppes: false

  # Durable resume support (see providermap/checkpoint.py) - a dedicated
  # SQLite file, separate from database.path, tracking which fetch phases/
  # batches a provider dataset adapter has already completed. null (default)
  # disables checkpointing entirely. Set a path before any run expected to
  # take hours, so it survives an interruption without re-fetching
  # everything already done.
  checkpoint_path: null

  # How many checkpoint writes accumulate before actually committing to
  # disk. 1 commits every single write (maximum durability, no batching). An
  # offline benchmark against a Rhode Island-shaped workload (~42,000 writes,
  # ~94% tiny/empty payloads) measured commit-per-write throughput collapse
  # to single digits per second at real file sizes, vs. 100+x higher
  # throughput batching every 100 writes on the identical workload - see
  # adapters/providers/cigna_fhir/evidence/ for the numbers. A crash between
  # batched commits only costs re-fetching up to this many already-done
  # items on resume (harmless - re-fetching is idempotent), never data loss.
  checkpoint_commit_every: 100

  # Bounded concurrency for the PractitionerRole batch phase only (see
  # adapters/providers/cigna_fhir/CONCURRENCY_DESIGN.md). 1 (default)
  # reproduces the original fully-sequential behavior exactly. The Location
  # phase and the unscoped search stay sequential regardless of this value -
  # both paginate via an opaque continuation token that can't be
  # parallelized.
  cigna_fhir_max_concurrent_requests: 1

  # Independent of the concurrency limit above - caps how fast new batch
  # requests are dispatched, not just how many are in flight at once.
  cigna_fhir_requests_per_second: 5.0

  # Which discovery strategy CignaFhirAdapter.discover() delegates to (see
  # adapters/providers/cigna_fhir/discovery.py and
  # NATIONAL_DISCOVERY_DESIGN.md). "state_scoped" (the default) reproduces
  # the original behavior exactly. "national" is a memory-bounded, spool-
  # backed strategy (see resource_spool_path below) - implemented, but this
  # default does not change until a production-quality national ingestion
  # has completed successfully and been verified (see docs/adr/0001-*.md).
  cigna_fhir_discovery_mode: "state_scoped"

  # Only read by the "national" discovery strategy - a dedicated SQLite
  # file every fetched FHIR resource is spooled to instead of an in-memory
  # cache (see providermap/resource_spool.py). null (default) means
  # national mode isn't usable yet - selecting it without a path set raises
  # rather than silently using the unbounded cache this strategy avoids.
  resource_spool_path: null

  # National discovery partitions its walk into _lastUpdated windows, each
  # this many days wide, covering the last cigna_fhir_lookback_days. Both
  # are documented defaults, not measured ones - a later calibration probe
  # right-sizes them against real data. Both ends of the walk stay open
  # regardless of these values, so nothing older or newer is ever missed.
  cigna_fhir_window_days: 30
  cigna_fhir_lookback_days: 3650
